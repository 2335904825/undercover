<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>今天吃什么 · 终极食物转盘</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    font-family: 'WenQuanYi Micro Hei', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  .bg-particles {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }
  .particle {
    position: absolute;
    border-radius: 50%;
    animation: float linear infinite;
    opacity: 0.15;
  }
  @keyframes float {
    0%   { transform: translateY(100vh) scale(0); opacity: 0; }
    10%  { opacity: 0.15; }
    100% { transform: translateY(-10vh) scale(1); opacity: 0; }
  }

  .container {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: clamp(4px, 1.5vw, 8px);
    width: 100%;
    max-width: 520px;
    flex: 1;
    justify-content: center;
  }

  h1 {
    font-size: clamp(1.1rem, 5.5vw, 1.8rem);
    color: #fff;
    margin-bottom: 2px;
    text-shadow: 0 0 20px rgba(255,165,0,0.5);
    letter-spacing: 2px;
    text-align: center;
    line-height: 1.3;
  }
  .subtitle {
    color: rgba(255,255,255,0.5);
    font-size: clamp(0.6rem, 2vw, 0.8rem);
    margin-bottom: 6px;
    text-align: center;
  }

  /* ===== 转盘区域 ===== */
  .wheel-wrapper {
    position: relative;
    width: clamp(220px, 80vw, 380px);
    height: clamp(220px, 80vw, 380px);
    margin-bottom: 6px;
  }

  .wheel-border {
    position: absolute;
    top: -6px; left: -6px;
    width: calc(100% + 12px);
    height: calc(100% + 12px);
    border-radius: 50%;
    background: conic-gradient(from 0deg, #ff6b00, #ffb800, #ff6b00, #ffb800, #ff6b00, #ffb800, #ff6b00, #ffb800, #ff6b00, #ffb800, #ff6b00, #ffb800);
    animation: borderSpin 4s linear infinite;
    box-shadow: 0 0 30px rgba(255,107,0,0.4), inset 0 0 15px rgba(255,184,0,0.3);
  }
  @keyframes borderSpin { to { transform: rotate(360deg); } }

  .wheel-border::after {
    content: '';
    position: absolute;
    top: 4px; left: 4px;
    width: calc(100% - 8px);
    height: calc(100% - 8px);
    border-radius: 50%;
    background: #1a1a2e;
  }

  .bulbs {
    position: absolute;
    top: -6px; left: -6px;
    width: calc(100% + 12px);
    height: calc(100% + 12px);
    border-radius: 50%;
    z-index: 2;
    pointer-events: none;
  }
  .bulb {
    position: absolute;
    width: clamp(4px, 1.6vw, 7px);
    height: clamp(4px, 1.6vw, 7px);
    border-radius: 50%;
    top: 50%; left: 50%;
    transform-origin: 0 0;
    animation: bulbBlink 1s ease-in-out infinite alternate;
  }
  .bulb::after {
    content: '';
    position: absolute;
    width: 100%; height: 100%;
    border-radius: 50%;
    background: inherit;
    box-shadow: 0 0 4px currentColor;
  }
  .bulb:nth-child(odd) { animation-delay: 0s; }
  .bulb:nth-child(even) { animation-delay: 0.5s; }
  @keyframes bulbBlink {
    0%   { opacity: 0.3; transform: translate(-50%,-50%) rotate(var(--a)) translate(clamp(120px, 40vw, 196px)) scale(0.8); }
    100% { opacity: 1;   transform: translate(-50%,-50%) rotate(var(--a)) translate(clamp(120px, 40vw, 196px)) scale(1.2); }
  }

  canvas#wheel {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    z-index: 3;
    filter: drop-shadow(0 4px 15px rgba(0,0,0,0.5));
  }

  /* 指针 - 顶部居中 */
  .pointer {
    position: absolute;
    top: -16px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    filter: drop-shadow(0 3px 6px rgba(0,0,0,0.7));
    pointer-events: none;
  }
  .pointer svg { width: clamp(24px, 8vw, 40px); height: clamp(32px, 10vw, 52px); }

  .center-btn {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    z-index: 10;
    width: clamp(48px, 15vw, 72px);
    height: clamp(48px, 15vw, 72px);
    border-radius: 50%;
    border: 3px solid #fff;
    background: radial-gradient(circle at 35% 35%, #ff4757, #c0392b);
    color: #fff;
    font-size: clamp(0.6rem, 2vw, 0.85rem);
    font-weight: 900;
    cursor: pointer;
    letter-spacing: 1px;
    box-shadow: 0 3px 12px rgba(255,71,87,0.5), inset 0 -2px 6px rgba(0,0,0,0.3);
    transition: transform 0.15s, box-shadow 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    line-height: 1.2;
    min-width: 44px;
    min-height: 44px;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .center-btn:active {
    transform: translate(-50%, -50%) scale(0.92);
    box-shadow: 0 2px 8px rgba(255,71,87,0.4);
  }
  .center-btn.disabled {
    background: radial-gradient(circle at 35% 35%, #888, #555);
    cursor: not-allowed;
    box-shadow: none;
  }

  /* ===== 排除标签区 ===== */
  .excluded-area {
    display: flex;
    flex-wrap: wrap;
    gap: 3px;
    justify-content: center;
    margin-bottom: 4px;
    min-height: 18px;
    max-width: 95vw;
    padding: 0 4px;
  }
  .excluded-tag {
    background: rgba(255,71,87,0.2);
    border: 1px solid rgba(255,71,87,0.5);
    color: #ff6b81;
    font-size: clamp(0.55rem, 1.8vw, 0.68rem);
    padding: 2px 6px;
    border-radius: 10px;
    animation: tagIn 0.3s ease;
    white-space: nowrap;
  }
  @keyframes tagIn {
    from { opacity: 0; transform: scale(0.5); }
    to   { opacity: 1; transform: scale(1); }
  }

  /* ===== 底部按钮 ===== */
  .bottom-bar {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    justify-content: center;
    width: 100%;
    padding: 0 8px;
  }
  .btn-reset, .btn-all {
    padding: 7px 14px;
    border-radius: 20px;
    font-size: clamp(0.7rem, 2.3vw, 0.82rem);
    cursor: pointer;
    transition: all 0.2s;
    min-height: 36px;
    -webkit-tap-highlight-color: transparent;
    flex: 1;
    min-width: 90px;
    max-width: 150px;
    touch-action: manipulation;
    border: none;
    font-weight: 600;
  }
  .btn-reset {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.3) !important;
    color: rgba(255,255,255,0.8);
  }
  .btn-reset:active { background: rgba(255,255,255,0.25); transform: scale(0.95); }

  .btn-all {
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff;
    box-shadow: 0 2px 10px rgba(102,126,234,0.4);
  }
  .btn-all:active { transform: scale(0.95); box-shadow: 0 1px 5px rgba(102,126,234,0.3); }

  /* ===== 弹窗 ===== */
  .modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.75);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: clamp(4px, 2vw, 12px);
    animation: fadeIn 0.3s ease;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .modal-overlay.show { display: flex; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .modal {
    background: linear-gradient(145deg, #1e1e3a, #2a2a5a);
    border-radius: 16px;
    padding: clamp(12px, 3.5vw, 18px) clamp(10px, 3vw, 14px) clamp(10px, 3vw, 14px);
    width: 100%;
    max-width: 440px;
    max-height: 92vh;
    overflow-y: auto;
    border: 1px solid rgba(255,255,255,0.1);
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    animation: popIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    position: relative;
    -webkit-overflow-scrolling: touch;
  }
  @keyframes popIn {
    from { opacity: 0; transform: scale(0.7) translateY(30px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }

  .modal-close {
    position: absolute;
    top: 6px; right: 10px;
    background: none; border: none;
    color: rgba(255,255,255,0.5);
    font-size: 1.6rem;
    cursor: pointer;
    z-index: 10;
    line-height: 1;
    width: 36px; height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-tap-highlight-color: transparent;
  }

  .modal-title {
    font-size: clamp(1rem, 4.2vw, 1.25rem);
    color: #ffb800;
    text-align: center;
    margin-bottom: 2px;
    font-weight: 900;
    padding-right: 24px;
  }
  .modal-subtitle {
    text-align: center;
    color: rgba(255,255,255,0.5);
    font-size: clamp(0.65rem, 2vw, 0.78rem);
    margin-bottom: 8px;
  }

  .food-table-wrap {
    max-height: 42vh;
    overflow-y: auto;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.1);
    margin-bottom: 10px;
    -webkit-overflow-scrolling: touch;
  }
  .food-table {
    width: 100%;
    border-collapse: collapse;
    font-size: clamp(0.65rem, 2.2vw, 0.76rem);
  }
  .food-table thead th {
    background: rgba(255,184,0,0.15);
    color: #ffb800;
    padding: 5px 6px;
    text-align: left;
    font-weight: 700;
    border-bottom: 1px solid rgba(255,184,0,0.2);
    position: sticky;
    top: 0;
    white-space: nowrap;
    z-index: 1;
  }
  .food-table tbody td {
    padding: 3.5px 6px;
    color: rgba(255,255,255,0.85);
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .food-table tbody tr:nth-child(even) td {
    background: rgba(255,255,255,0.03);
  }
  .food-table tbody tr:active {
    background: rgba(255,184,0,0.1);
  }
  .food-table .col-no { width: 22px; text-align: center; color: rgba(255,255,255,0.35); font-size: 0.65rem; }
  .food-table .col-name { font-weight: 600; color: rgba(255,255,255,0.9); }
  .food-table .col-desc { color: rgba(255,255,255,0.35); font-size: 0.6rem; }

  .modal-btns {
    display: flex;
    gap: 5px;
    flex-wrap: wrap;
    justify-content: center;
    position: sticky;
    bottom: 0;
    background: linear-gradient(180deg, transparent, #2a2a5a 40%);
    padding-top: 6px;
  }
  .modal-btns button {
    flex: 1;
    min-width: 70px;
    padding: 9px 6px;
    border-radius: 10px;
    font-size: clamp(0.68rem, 2.2vw, 0.82rem);
    font-weight: 700;
    cursor: pointer;
    border: none;
    transition: all 0.2s;
    -webkit-tap-highlight-color: transparent;
    min-height: 40px;
    touch-action: manipulation;
  }
  .modal-btns button:active { transform: scale(0.95); }

  .btn-confirm {
    background: linear-gradient(135deg, #00b894, #00d2a0);
    color: #fff;
    box-shadow: 0 3px 12px rgba(0,184,148,0.4);
  }
  .btn-reject {
    background: linear-gradient(135deg, #ff6b6b, #ee5a24);
    color: #fff;
    box-shadow: 0 3px 12px rgba(255,107,107,0.4);
  }
  .btn-reroll {
    background: linear-gradient(135deg, #a29bfe, #6c5ce7);
    color: #fff;
    box-shadow: 0 3px 12px rgba(108,92,231,0.4);
  }

  .hint {
    color: rgba(255,255,255,0.3);
    font-size: clamp(0.55rem, 1.8vw, 0.65rem);
    margin-top: 4px;
    text-align: center;
    padding: 0 8px;
  }

  .empty-state {
    text-align: center;
    color: rgba(255,255,255,0.6);
    padding: 16px 8px;
  }
  .empty-state .big-emoji { font-size: 2.2rem; margin-bottom: 6px; }

  .confetti {
    position: fixed;
    top: -10px;
    z-index: 200;
    pointer-events: none;
    animation: confettiFall linear forwards;
  }
  @keyframes confettiFall {
    0%   { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(105vh) rotate(720deg); opacity: 0; }
  }

  /* ========== 移动端适配 ========== */
  @media (max-width: 480px) {
    body { justify-content: flex-start; padding-top: max(8px, env(safe-area-inset-top)); }
    .container { padding: 3px; }
    h1 { font-size: 1.2rem; margin-bottom: 1px; }
    .subtitle { font-size: 0.58rem; margin-bottom: 4px; }
    .wheel-wrapper { margin-bottom: 4px; }
    .excluded-area { gap: 2px; margin-bottom: 3px; }
    .bottom-bar { gap: 5px; padding: 0 5px; }
    .modal { border-radius: 14px; }
    .food-table .col-desc,
    .food-table thead th:nth-child(3),
    .food-table tbody td:nth-child(3) { display: none; }
    .modal-btns { gap: 3px; }
    .modal-btns button { min-width: 60px; padding: 7px 4px; font-size: 0.65rem; }
    .food-table-wrap { max-height: 45vh; }
  }

  @media (max-width: 360px) {
    h1 { font-size: 1rem; }
    .wheel-wrapper { width: 90vw; height: 90vw; }
    .modal-title { font-size: 0.95rem; }
    .food-table { font-size: 0.6rem; }
  }

  @media (max-height: 500px) and (orientation: landscape) {
    body { justify-content: flex-start; padding-top: 4px; }
    .container { flex-direction: row; flex-wrap: wrap; max-width: 100vw; gap: 8px; }
    .wheel-wrapper { width: 42vh; height: 42vh; margin-bottom: 0; }
    h1 { font-size: 0.9rem; width: 100%; margin-bottom: 0; }
    .subtitle { font-size: 0.55rem; width: 100%; margin-bottom: 0; }
    .excluded-area { max-width: 50vw; }
    .bottom-bar { flex-direction: column; }
    .modal { max-height: 95vh; }
    .food-table-wrap { max-height: 30vh; }
  }

  @media (min-width: 768px) {
    .wheel-wrapper { width: 400px; height: 400px; }
    .modal { max-width: 460px; }
    .food-table { font-size: 0.8rem; }
  }
</style>
</head>
<body>

<div class="bg-particles" id="particles"></div>

<div class="container">
  <h1>🎯 今天吃什么</h1>
  <p class="subtitle">点中间按钮旋转 · 按空格键也能转</p>

  <div class="wheel-wrapper">
    <div class="wheel-border"></div>
    <div class="bulbs" id="bulbs"></div>
    <canvas id="wheel"></canvas>
    <div class="pointer">
      <svg viewBox="0 0 60 80">
        <defs>
          <linearGradient id="pg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#ffb800"/>
            <stop offset="100%" stop-color="#ff6b00"/>
          </linearGradient>
        </defs>
        <polygon points="30,0 0,50 22,50 22,80 38,80 38,50 60,50" fill="url(#pg)" stroke="#fff" stroke-width="2"/>
      </svg>
    </div>
    <button class="center-btn" id="spinBtn" onclick="spin()">开始</button>
  </div>

  <div class="excluded-area" id="excludedArea"></div>

  <div class="bottom-bar">
    <button class="btn-all" onclick="showAllCategories()">📋 查看全部分类</button>
    <button class="btn-reset" onclick="resetWheel()">🔄 重置转盘</button>
  </div>

  <p class="hint">转到的分类不想吃？点「🙅 不想吃」即可永久排除</p>
</div>

<!-- 弹窗 -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">×</button>
    <div class="modal-title" id="modalTitle"></div>
    <div class="modal-subtitle" id="modalSubtitle"></div>
    <div id="modalBody"></div>
    <div class="modal-btns" id="modalBtns">
      <button class="btn-confirm" onclick="confirmChoice()">✅ 就吃这个！</button>
      <button class="btn-reject" onclick="rejectAndRespin()">🙅 不想吃，再转</button>
      <button class="btn-reroll" onclick="rerollKeep()">🎯 直接再转</button>
    </div>
  </div>
</div>

// ========================================================================
//  转盘逻辑
// ========================================================================
let activeCategories = CATEGORIES.slice();
let excludedCategories = [];
let currentSpinning = false;
let currentResult = null;

const canvas = document.getElementById('wheel');
const ctx = canvas.getContext('2d');
let DPR = window.devicePixelRatio || 1;
let currentRotation = 0; // 当前转盘累积旋转弧度（canvas绘制时的整体旋转）

// ============================================================
//  角度约定（统一标准，杜绝指针指向不一致）：
//
//  ★ 我们自定义一个「屏幕角度」系统：
//    - 0° = 顶部（12点钟），顺时针为正
//    - 90° = 右边（3点钟），180° = 底部，270° = 左边
//
//  ★ Canvas 内部角度系统：
//    - 0° = 右边（3点钟），顺时针为正（Y轴向下）
//    - 所以 canvas 角度 = 屏幕角度 - 90°（即减去 π/2）
//
//  ★ 扇区 i 的「屏幕中心角度」= i * arc（从顶部顺时针排）
//  ★ 指针始终在屏幕 0° 方向（顶部）
//  ★ 要让扇区 i 对准指针：扇区 i 的屏幕角度 + currentRotation = 0 (mod 360)
//    即 currentRotation = -i * arc (mod 2π)
// ============================================================

// 将「屏幕角度」（0°=顶部，顺时针）转换为 canvas 内部角度
function screenToCanvasAngle(screenAngle) {
  return screenAngle - Math.PI / 2; // 屏幕0°(顶部) → canvas -90°(也是顶部)
}

// 将 canvas 内部角度转换回「屏幕角度」
function canvasToScreenAngle(canvasAngle) {
  let a = canvasAngle + Math.PI / 2;
  // 归一化到 [0, 2π)
  a = ((a % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
  return a;
}

function resizeCanvas() {
  DPR = window.devicePixelRatio || 1;
  const rect = canvas.parentElement.getBoundingClientRect();
  const size = rect.width;
  canvas.width = size * DPR;
  canvas.height = size * DPR;
  canvas.style.width = size + 'px';
  canvas.style.height = size + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawWheel();
}

function drawWheel() {
  const w = canvas.width / DPR;
  const h = canvas.height / DPR;
  const cx = w / 2, cy = h / 2;
  const radius = w / 2 - 4;
  const count = activeCategories.length;

  ctx.clearRect(0, 0, w, h);

  if (count === 0) {
    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, Math.PI * 2);
    ctx.fillStyle = '#2a2a4a';
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = '16px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('所有分类已排除', cx, cy - 10);
    ctx.fillText('请重置转盘', cx, cy + 15);
    return;
  }

  const arc = (Math.PI * 2) / count;

  // 扇区 i 的「屏幕中心角度」= i * arc（从顶部顺时针）
  // 转换为 canvas 角度需要减去 π/2
  // 但我们用 ctx.rotate(currentRotation) 来旋转整个转盘
  // 策略：先把 canvas 坐标系旋转 -π/2 让 0° 指向顶部
  // 然后扇区 i 就从 i*arc 开始画

  ctx.save();
  ctx.translate(cx, cy);

  // 先旋转 -π/2 让 0° 对齐到顶部（屏幕角度系统）
  // 再加上 currentRotation（顺时针为正）
  ctx.rotate(-Math.PI / 2 + currentRotation);

  for (let i = 0; i < count; i++) {
    const cat = activeCategories[i];
    // 扇区 i 从屏幕角度 i*arc 到 (i+1)*arc
    // 由于已旋转 -π/2，canvas 角度 = 屏幕角度
    const startAngle = i * arc;
    const endAngle = startAngle + arc;

    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.arc(0, 0, radius, startAngle, endAngle);
    ctx.closePath();
    ctx.fillStyle = cat.color;
    ctx.fill();

    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
    ctx.lineWidth = 1;
    ctx.stroke();

    // 文字放在扇区中间
    ctx.save();
    ctx.rotate(startAngle + arc / 2);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    const textR = radius * 0.58;
    const fontSize = Math.max(8, Math.min(12, w / (count * 0.35)));
    ctx.font = 'bold ' + fontSize + 'px "WenQuanYi Micro Hei", sans-serif';
    ctx.fillStyle = cat.textColor;

    ctx.shadowColor = 'rgba(0,0,0,0.5)';
    ctx.shadowBlur = 3;
    ctx.shadowOffsetX = 1;
    ctx.shadowOffsetY = 1;

    // 缩短文字适配小扇区
    let name = cat.name;
    if (name.length > 6) name = name.substring(0, 6);
    ctx.fillText(name, textR, 0);
    ctx.restore();
  }

  ctx.restore();

  // 中心装饰圆（不随转盘旋转）
  ctx.beginPath();
  ctx.arc(cx, cy, radius * 0.16, 0, Math.PI * 2);
  ctx.fillStyle = '#1a1a2e';
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.2)';
  ctx.lineWidth = 2;
  ctx.stroke();
}

function createBulbs() {
  const container = document.getElementById('bulbs');
  container.innerHTML = '';
  const bulbCount = 24;
  const colors = ['#ff6b00', '#ffb800', '#ff4757', '#ffa502', '#eccc68', '#ff6348'];
  for (let i = 0; i < bulbCount; i++) {
    const angle = (i / bulbCount) * 360;
    const bulb = document.createElement('div');
    bulb.className = 'bulb';
    bulb.style.setProperty('--a', angle + 'deg');
    const color = colors[i % colors.length];
    bulb.style.background = color;
    bulb.style.color = color;
    container.appendChild(bulb);
  }
}

function spin() {
  if (currentSpinning) return;
  if (activeCategories.length === 0) {
    showEmptyModal();
    return;
  }

  currentSpinning = true;
  const btn = document.getElementById('spinBtn');
  btn.classList.add('disabled');
  btn.textContent = '转动中';

  const count = activeCategories.length;
  const arc = (Math.PI * 2) / count;

  // 随机选一个目标扇区
  const targetIndex = Math.floor(Math.random() * count);
  const targetCat = activeCategories[targetIndex];

  // ===== 角度计算（统一使用屏幕角度系统）=====
  // 屏幕角度：0° = 顶部，顺时针为正
  // 扇区 i 的屏幕中心角度 = i * arc + arc / 2
  // 指针在屏幕 0° 方向
  //
  // drawWheel 中：ctx.rotate(-π/2 + currentRotation)
  // 这意味着 canvas 角度 0 对应屏幕角度 currentRotation
  // 扇区 i 的屏幕角度 = currentRotation + i * arc
  //
  // 要让扇区 targetIndex 对准指针(屏幕0°)：
  //   currentRotation_new + targetIndex * arc = 0 (mod 2π)
  //   currentRotation_new = -targetIndex * arc (mod 2π)
  //
  // deltaRotation = currentRotation_new - currentRotation
  //               = -targetIndex * arc - currentRotation (mod 2π)

  const targetSectorScreenAngle = targetIndex * arc + arc / 2;

  // 目标：扇区中心对准指针(屏幕0°)
  // currentRotation_after + targetSectorScreenAngle = 0 (mod 2π)
  // currentRotation_after = -targetSectorScreenAngle (mod 2π)
  let targetRotation = -targetSectorScreenAngle;
  // 归一化到 [0, 2π)
  targetRotation = ((targetRotation % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);

  // 从当前位置到目标位置需要旋转的量
  // 我们要顺时针旋转（正值），所以找最短正路径
  let deltaRotation = targetRotation - currentRotation;
  // 归一化到 [0, 2π)
  deltaRotation = ((deltaRotation % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);

  // 加上额外的整圈旋转（5~8圈）
  const fullSpins = 5 + Math.floor(Math.random() * 4);
  const totalRotation = fullSpins * Math.PI * 2 + deltaRotation;

  const duration = 5000 + Math.random() * 2000;
  const startTime = performance.now();
  const startRotation = currentRotation;

  function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

  function animate(now) {
    const elapsed = now - startTime;
    const progress = Math.min(elapsed / duration, 1);
    const eased = easeOutCubic(progress);
    currentRotation = startRotation + totalRotation * eased;
    drawWheel();
    if (progress < 1) {
      requestAnimationFrame(animate);
    } else {
      // 动画结束，精确设置为目标角度 + 整圈
      currentRotation = startRotation + totalRotation;
      // 归一化
      currentRotation = ((currentRotation % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);

      // 验证：扇区 targetIndex 此时应该在指针位置
      // 扇区 i 的屏幕角度 = currentRotation + i * arc (mod 2π)
      const sectorAngle = (currentRotation + targetIndex * arc + arc / 2) % (Math.PI * 2);
      // 应该 ≈ 0 或 2π
      const diff = Math.min(sectorAngle, Math.PI * 2 - sectorAngle);
      if (diff > 0.01) {
        console.warn('[转盘] 角度校验偏差: ' + (diff * 180 / Math.PI).toFixed(2) + '°');
      }

      currentSpinning = false;
      btn.classList.remove('disabled');
      btn.textContent = '开始';
      currentResult = targetCat;
      showResultModal(targetCat);
      launchConfetti();
    }
  }
  requestAnimationFrame(animate);
}

// 获取指针当前指向的分类
// 指针在屏幕 0°（顶部）
// 扇区 i 的屏幕角度 = (currentRotation + i * arc) % 2π
// 扇区 i 占据 [(currentRotation + i*arc) % 2π, (currentRotation + (i+1)*arc) % 2π]
// 指针在 0°，找包含 0° 的扇区
function getPointedCategory() {
  const count = activeCategories.length;
  if (count === 0) return null;
  const arc = (Math.PI * 2) / count;

  // 反向计算：currentRotation + i * arc ≤ 0 < currentRotation + (i+1) * arc (mod 2π)
  // 等价于：(-currentRotation) 落在 [i*arc, (i+1)*arc) 模 2π
  let negRot = (-currentRotation) % (Math.PI * 2);
  if (negRot < 0) negRot += Math.PI * 2;

  const index = Math.floor(negRot / arc) % count;
  return activeCategories[index];
}

function showResultModal(cat) {
  const modal = document.getElementById('modal');
  document.getElementById('modalTitle').textContent = '🎉 恭喜抽到：' + cat.name;
  document.getElementById('modalSubtitle').textContent = '以下 ' + cat.foods.length + ' 种美食供你挑选 👇';

  let tableHTML = '<div class="food-table-wrap"><table class="food-table"><thead><tr><th class="col-no">#</th><th>美食名称</th><th>特色说明</th></tr></thead><tbody>';
  cat.foods.forEach(function(f, i) {
    tableHTML += '<tr><td class="col-no">' + (i+1) + '</td><td class="col-name">' + f[0] + '</td><td class="col-desc">' + f[1] + '</td></tr>';
  });
  tableHTML += '</tbody></table></div>';
  document.getElementById('modalBody').innerHTML = tableHTML;

  document.getElementById('modalBtns').innerHTML =
    '<button class="btn-confirm" onclick="confirmChoice()">✅ 就吃这个！</button>' +
    '<button class="btn-reject" onclick="rejectAndRespin()">🙅 不想吃，再转</button>' +
    '<button class="btn-reroll" onclick="rerollKeep()">🎯 直接再转</button>';

  modal.classList.add('show');
}

function showEmptyModal() {
  const modal = document.getElementById('modal');
  document.getElementById('modalTitle').textContent = '😅 所有分类都排除了';
  document.getElementById('modalSubtitle').textContent = '点击下方按钮重置转盘吧';
  document.getElementById('modalBody').innerHTML =
    '<div class="empty-state"><div class="big-emoji">🍽️</div><p>已经没有可选分类了</p>' +
    '<p style="margin-top:8px;font-size:0.8rem;color:rgba(255,255,255,0.4);">共排除了 ' + excludedCategories.length + ' 个分类</p></div>';
  document.getElementById('modalBtns').innerHTML = '<button class="btn-confirm" onclick="closeModal()">✅ 知道了</button>';
  modal.classList.add('show');
}

function closeModal() {
  document.getElementById('modal').classList.remove('show');
}

function confirmChoice() {
  closeModal();
}

function rejectAndRespin() {
  if (!currentResult) return;
  const cat = currentResult;
  activeCategories = activeCategories.filter(function(c) { return c.name !== cat.name; });
  excludedCategories.push(cat);
  renderExcludedTags();
  closeModal();
  currentResult = null;
  drawWheel();
  setTimeout(function() {
    if (activeCategories.length > 0) {
      spin();
    } else {
      showEmptyModal();
    }
  }, 400);
}

function rerollKeep() {
  closeModal();
  currentResult = null;
  setTimeout(function() { spin(); }, 300);
}

function renderExcludedTags() {
  const area = document.getElementById('excludedArea');
  area.innerHTML = excludedCategories.map(function(c) { return '<span class="excluded-tag">' + c.name + '</span>'; }).join('');
}

function resetWheel() {
  activeCategories = CATEGORIES.slice();
  excludedCategories = [];
  currentResult = null;
  currentRotation = 0;
  renderExcludedTags();
  drawWheel();
  closeModal();
}

function showAllCategories() {
  const modal = document.getElementById('modal');
  document.getElementById('modalTitle').textContent = '📋 全部分类一览';
  document.getElementById('modalSubtitle').textContent = '共 ' + CATEGORIES.length + ' 大分类，' + CATEGORIES.reduce(function(sum, c) { return sum + c.foods.length; }, 0) + ' 种美食';

  let html = '';
  CATEGORIES.forEach(function(cat) {
    const isExcluded = excludedCategories.some(function(c) { return c.name === cat.name; });
    html += '<div style="margin-bottom:8px;padding:8px;border-radius:10px;background:' + cat.color + '22;border:1px solid ' + cat.color + '44;' + (isExcluded ? 'opacity:0.4;' : '') + '">' +
      '<div style="font-weight:700;color:' + cat.color + ';margin-bottom:3px;font-size:0.85rem;">' + cat.name + ' ' + (isExcluded ? '(已排除)' : '') + ' <span style="color:rgba(255,255,255,0.4);font-weight:400;font-size:0.7rem;">(' + cat.foods.length + '种)</span></div>' +
      '<div style="font-size:0.65rem;color:rgba(255,255,255,0.5);line-height:1.6;">' + cat.foods.map(function(f){return f[0];}).join('、') + '</div></div>';
  });
  document.getElementById('modalBody').innerHTML = '<div style="max-height:50vh;overflow-y:auto;-webkit-overflow-scrolling:touch;">' + html + '</div>';
  document.getElementById('modalBtns').innerHTML = '<button class="btn-confirm" onclick="closeModal()">✅ 知道了</button>';
  modal.classList.add('show');
}

function launchConfetti() {
  const colors = ['#ff6b00','#ffb800','#ff4757','#ffa502','#eccc68','#ff6348','#70a1ff','#7bed9f','#ff6b81','#a29bfe'];
  const count = window.innerWidth < 600 ? 40 : 80;
  for (let i = 0; i < count; i++) {
    const conf = document.createElement('div');
    conf.className = 'confetti';
    const size = 6 + Math.random() * 8;
    conf.style.cssText =
      'left:' + Math.random()*100 + '%;' +
      'width:' + size + 'px;height:' + (size*0.4) + 'px;' +
      'background:' + colors[Math.floor(Math.random()*colors.length)] + ';' +
      'border-radius:' + (Math.random()>0.5?'50%':'2px') + ';' +
      'animation-duration:' + (2+Math.random()*3) + 's;' +
      'animation-delay:' + (Math.random()*0.5) + 's;' +
      'transform:rotate(' + (Math.random()*360) + 'deg);';
    document.body.appendChild(conf);
    setTimeout(function() { conf.remove(); }, 5500);
  }
}

function createParticles() {
  const container = document.getElementById('particles');
  container.innerHTML = '';
  const count = window.innerWidth < 600 ? 15 : 30;
  const colors = ['#ff6b00','#ffb800','#ff4757','#a29bfe','#70a1ff','#7bed9f'];
  for (let i = 0; i < count; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const size = 4 + Math.random() * 12;
    p.style.cssText =
      'left:' + Math.random()*100 + '%;' +
      'width:' + size + 'px;height:' + size + 'px;' +
      'background:' + colors[Math.floor(Math.random()*colors.length)] + ';' +
      'animation-duration:' + (8+Math.random()*12) + 's;' +
      'animation-delay:' + (Math.random()*10) + 's;';
    container.appendChild(p);
  }
}

document.addEventListener('keydown', function(e) {
  if (e.code === 'Space') { e.preventDefault(); spin(); }
  if (e.code === 'Escape') { closeModal(); }
});

window.addEventListener('resize', function() {
  resizeCanvas();
  createParticles();
});

// 防止移动端触摸滑动导致页面滚动
document.addEventListener('touchmove', function(e) {
  if (e.target.closest('.modal-overlay') || e.target.closest('.food-table-wrap')) return;
  e.preventDefault();
}, { passive: false });

// 初始化
createBulbs();
createParticles();
resizeCanvas();

// 自测：确保指针指向计算正确
console.log('[转盘] 共 ' + CATEGORIES.length + ' 个分类，' + CATEGORIES.reduce(function(s,c){return s+c.foods.length;},0) + ' 种美食');
console.log('[转盘] 角度系统: 0°=顶部，顺时针为正');

// 启动时验证：旋转到每个扇区，检查指针指向
(function selfTest() {
  const count = CATEGORIES.length;
  const arc = (Math.PI * 2) / count;
  let pass = 0, fail = 0;
  for (let i = 0; i < count; i++) {
    // 模拟扇区 i 对准指针时的 currentRotation
    // 扇区 i 屏幕角度 = currentRotation + i*arc + arc/2 = 0 (mod 2π)
    currentRotation = (-i * arc - arc / 2) % (Math.PI * 2);
    if (currentRotation < 0) currentRotation += Math.PI * 2;
    const pointed = getPointedCategory();
    if (pointed && pointed.name === CATEGORIES[i].name) {
      pass++;
    } else {
      fail++;
      console.error('[自测] 扇区' + i + ' 指向错误: 期望 ' + CATEGORIES[i].name + ', 实际 ' + (pointed ? pointed.name : 'null'));
    }
  }
  console.log('[自测] 指针指向验证: ' + pass + '/' + count + ' 通过' + (fail > 0 ? ', ' + fail + ' 失败' : ''));
})();
</script>
