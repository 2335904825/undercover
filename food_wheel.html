    overflow: hidden;
    position: relative;
  }

  /* 星空背景 */

    content: '';

    background:

      radial-gradient(1px 1px at 30% 50%, rgba(255,255,255,0.6), transparent),
      radial-gradient(1.5px 1.5px at 50% 10%, rgba(255,255,255,0.9), transparent),
      radial-gradient(1px 1px at 70% 40%, rgba(255,255,255,0.5), transparent),

      radial-gradient(1.5px 1.5px at 20% 70%, rgba(255,255,255,0.6), transparent),
      radial-gradient(1px 1px at 60% 90%, rgba(255,255,255,0.8), transparent),
      radial-gradient(1px 1px at 80% 15%, rgba(255,255,255,0.5), transparent),
      radial-gradient(1px 1px at 40% 85%, rgba(255,255,255,0.7), transparent),
      radial-gradient(1.5px 1.5px at 15% 45%, rgba(255,255,255,0.4), transparent);
    pointer-events: none;
    z-index: 0;
  }

  .title {
    font-size: 42px;
    font-weight: 900;
    background: linear-gradient(90deg, #ff6b6b, #ffd93d, #6bcb77, #4d96ff, #ff6b6b);
    background-size: 300% 100%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: titleShine 4s ease infinite;
    margin-bottom: 8px;
    z-index: 1;
    text-shadow: none;
    letter-spacing: 4px;
  }

  @keyframes titleShine {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }

  .subtitle {
    color: rgba(255,255,255,0.6);
    font-size: 14px;
    margin-bottom: 20px;
    z-index: 1;
    letter-spacing: 2px;
  }

  .wheel-container {
    position: relative;
    width: 520px;
    height: 520px;
    z-index: 1;
  }

  /* 外圈装饰灯 */
  .outer-ring {
    position: absolute;
    top: -18px; left: -18px;
    width: 556px; height: 556px;
    border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.15);
  }

  .bulbs {
    position: absolute;
    top: -18px; left: -18px;
    width: 556px; height: 556px;
    border-radius: 50%;
    pointer-events: none;
  }

  .bulb {
    position: absolute;
    width: 10px; height: 10px;
    border-radius: 50%;
    top: 50%; left: 50%;
    transform-origin: 0 0;
    animation: bulbBlink 1.5s ease-in-out infinite alternate;
  }

  .bulb:nth-child(odd) { animation-delay: 0.3s; }
  .bulb:nth-child(3n) { animation-delay: 0.6s; }
  .bulb:nth-child(5n) { animation-delay: 0.9s; }

  @keyframes bulbBlink {
    0% { opacity: 0.3; box-shadow: 0 0 2px currentColor; }
    100% { opacity: 1; box-shadow: 0 0 8px currentColor, 0 0 16px currentColor; }
  }

  canvas { border-radius: 50%; }

  /* 中心按钮 */
  .center-btn {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 100px; height: 100px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #ff6b6b, #ee3333, #cc0000);
    border: 4px solid #fff;
    color: #fff;
    font-size: 16px;
    font-weight: 900;
    cursor: pointer;
    z-index: 10;
    box-shadow: 0 4px 20px rgba(238,51,51,0.6), inset 0 -3px 8px rgba(0,0,0,0.3);
    transition: transform 0.15s, box-shadow 0.15s;
    letter-spacing: 2px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .center-btn:hover { transform: translate(-50%, -50%) scale(1.08); box-shadow: 0 6px 30px rgba(238,51,51,0.8), inset 0 -3px 8px rgba(0,0,0,0.3); }
  .center-btn:active { transform: translate(-50%, -50%) scale(0.95); }
  .center-btn.disabled { cursor: not-allowed; opacity: 0.6; }

  /* 指针 */
  .pointer {
    position: absolute;
    top: -6px; left: 50%;
    transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 18px solid transparent;
    border-right: 18px solid transparent;
    border-top: 36px solid #ffd93d;
    filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));
    z-index: 11;
    transition: filter 0.3s;
  }

  /* 底部统计 */
  .stats-bar {
    margin-top: 18px;
    z-index: 1;
    display: flex;
    gap: 24px;
    align-items: center;
  }
  .stats-bar span {
    color: rgba(255,255,255,0.7);
    font-size: 13px;
  }
  .stats-bar .highlight { color: #ffd93d; font-weight: 700; }

  /* 重置按钮 */
  .reset-btn {
    margin-top: 12px;
    z-index: 1;
    padding: 8px 24px;
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.3);
    background: rgba(255,255,255,0.08);
    color: rgba(255,255,255,0.7);
    font-size: 13px;
    cursor: pointer;
    transition: all 0.3s;
    letter-spacing: 1px;
  }
  .reset-btn:hover { background: rgba(255,255,255,0.18); color: #fff; }

  /* 已排除标签 */
  .excluded-bar {
    margin-top: 10px;
    z-index: 1;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    justify-content: center;
    max-width: 560px;
    min-height: 24px;
  }
  .excluded-tag {
    background: rgba(255,80,80,0.2);
    border: 1px solid rgba(255,80,80,0.4);
    color: #ff9999;
    font-size: 11px;
    padding: 2px 10px;
    border-radius: 10px;
    animation: fadeInScale 0.3s ease;
  }
  @keyframes fadeInScale {
    from { opacity: 0; transform: scale(0.5); }
    to { opacity: 1; transform: scale(1); }
  }

  /* ===== 弹窗 ===== */
  .modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.7);
    z-index: 100;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(4px);
    animation: fadeIn 0.3s ease;
  }
  .modal-overlay.show { display: flex; }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .modal {
    background: linear-gradient(145deg, #1e1e50, #2a2a6e);
    border: 2px solid rgba(255,255,255,0.15);
    border-radius: 24px;
    padding: 36px 40px 28px;
    max-width: 560px;
    width: 90%;
    max-height: 82vh;
    overflow-y: auto;
    text-align: center;
    position: relative;
    animation: popIn 0.4s cubic-bezier(0.18, 0.89, 0.32, 1.28);
    box-shadow: 0 20px 80px rgba(0,0,0,0.6);
  }

  @keyframes popIn {
    from { transform: scale(0.5); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  .modal .emoji-big { font-size: 56px; margin-bottom: 8px; }

  .modal h2 {
    font-size: 22px;
    color: #fff;
    margin-bottom: 4px;
  }

  .modal .category-name {
    font-size: 32px;
    font-weight: 900;
    background: linear-gradient(90deg, #ff6b6b, #ffd93d, #6bcb77);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin: 6px 0 4px;
  }

  .modal .desc {
    color: rgba(255,255,255,0.55);
    font-size: 13px;
    margin-bottom: 16px;
  }

  /* 食物表格 */
  .food-table {
    width: 100%;
    border-collapse: collapse;
    margin: 10px 0 18px;
    font-size: 13px;
  }
  .food-table thead th {
    background: rgba(255,255,255,0.1);
    color: #ffd93d;
    padding: 8px 10px;
    font-size: 12px;
    letter-spacing: 1px;
    border-bottom: 2px solid rgba(255,255,255,0.15);

  .food-table tbody td {
    padding: 7px 10px;
    color: rgba(255,255,255,0.85);
    border-bottom: 1px solid rgba(255,255,255,0.06);
    text-align: left;

  .food-table tbody tr:hover td { background: rgba(255,255,255,0.08); }
  .food-table .num { color: rgba(255,255,255,0.35); font-size: 11px; text-align: center; width: 36px; }
  .food-table .tag {

    font-size: 10px;
    padding: 1px 7px;

    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;

    font-size: 15px;
    font-weight: 700;

    letter-spacing: 2px;
    box-shadow: 0 4px 16px rgba(238,51,51,0.4);

  .btn-skip {
    padding: 12px 28px;
    border-radius: 30px;
    border: 1px solid rgba(255,255,255,0.3);
    background: rgba(255,255,255,0.08);
    color: rgba(255,255,255,0.8);
    font-size: 14px;
    cursor: pointer;
    letter-spacing: 1px;
    transition: all 0.2s;

  .btn-skip:hover { background: rgba(255,255,255,0.18); color: #fff; }

  .btn-spin-again {
    padding: 12px 28px;
    border-radius: 30px;
    border: 1px solid rgba(255,217,61,0.4);
    background: rgba(255,217,61,0.1);
    color: #ffd93d;
    font-size: 14px;
    cursor: pointer;
    letter-spacing: 1px;
    transition: all 0.2s;
  }
  .btn-spin-again:hover { background: rgba(255,217,61,0.25); }

  /* 撒花 canvas */
  #confetti { position: fixed; top: 0; left: 0; pointer-events: none; z-index: 200; }

  /* 滚动条 */
  .modal::-webkit-scrollbar { width: 6px; }
  .modal::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }
</style>
</head>

</div>

      ["泡芙", "酥皮灌奶油，一口爆浆"],
      ["马卡龙", "法式甜点，缤纷色彩"],
      ["焦糖布丁", "滑嫩焦香，甜蜜诱惑"],
      ["水果茶", "鲜果泡茶，清爽解腻"],
      ["巧克力慕斯", "丝滑浓郁，甜品控天堂"],
      ["鲜芋仙", "芋圆仙草，台式甜品"],
      ["冰粉", "四川冰粉，红糖芝麻花生碎"],
      ["绿豆汤", "夏日解暑，清甜消暑"],
      ["刨冰", "雪花冰配炼乳水果"],
      ["可丽露", "法式小点心，焦脆软糯"],
      ["司康饼", "英式下午茶，配奶油果酱"],
      ["奶黄包", "广式早茶，流心奶黄"],
    ]
  },
];

// ========== 转盘绘制 ==========
const canvas = document.getElementById('wheel');
const ctx = canvas.getContext('2d');
const N = CATEGORIES.length; // 16
let activeIndices = [...Array(N).keys()]; // 当前可用的分类索引
let currentAngle = 0;
let isSpinning = false;
let spinCount = 0;
let excludedCategories = []; // 被排除的分类名称

function drawWheel() {
  const cx = canvas.width / 2, cy = canvas.height / 2;
  const radius = canvas.width / 2 - 4;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const segAngle = (2 * Math.PI) / activeIndices.length;

  // 绘制每个扇区
  activeIndices.forEach((catIdx, i) => {
    const cat = CATEGORIES[catIdx];
    const startAngle = currentAngle + i * segAngle - Math.PI / 2;
    const endAngle = startAngle + segAngle;

    // 扇区
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, radius, startAngle, endAngle);
    ctx.closePath();

    // 渐变填充
    const grad = ctx.createRadialGradient(cx, cy, radius * 0.2, cx, cy, radius);
    grad.addColorStop(0, lighten(cat.color, 30));
    grad.addColorStop(1, cat.color);
    ctx.fillStyle = grad;
    ctx.fill();

    // 边框线
    ctx.strokeStyle = 'rgba(255,255,255,0.25)';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // 文字
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(startAngle + segAngle / 2);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    const textR = radius * 0.62;
    const fontSize = activeIndices.length > 12 ? 13 : 15;
    ctx.font = `bold ${fontSize}px 'Microsoft YaHei'`;
    ctx.fillStyle = '#fff';
    ctx.shadowColor = 'rgba(0,0,0,0.5)';
    ctx.shadowBlur = 4;

    const label = cat.emoji + ' ' + cat.name;
    // 如果文字太长，缩小
    const metrics = ctx.measureText(label);
    if (metrics.width > radius * 0.7) {
      ctx.font = `bold 11px 'Microsoft YaHei'`;
    }
    ctx.fillText(label, textR, 0);
    ctx.restore();
  });

  // 外圈金色圆环
  ctx.beginPath();
  ctx.arc(cx, cy, radius, 0, 2 * Math.PI);
  ctx.strokeStyle = 'rgba(255,217,61,0.6)';
  ctx.lineWidth = 3;
  ctx.stroke();

  // 内圈装饰
  ctx.beginPath();
  ctx.arc(cx, cy, radius * 0.22, 0, 2 * Math.PI);
  ctx.strokeStyle = 'rgba(255,255,255,0.15)';
  ctx.lineWidth = 2;
  ctx.stroke();
}

function lighten(hex, pct) {
  let r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  r = Math.min(255, r + pct); g = Math.min(255, g + pct); b = Math.min(255, b + pct);
  return `rgb(${r},${g},${b})`;
}

// ========== 装饰灯泡 ==========
function createBulbs() {
  const container = document.getElementById('bulbs');
  container.innerHTML = '';
  const colors = ['#ff6b6b','#ffd93d','#6bcb77','#4d96ff','#ff6b6b','#ffd93d','#a29bfe','#fd79a8','#00cec9','#fdcb6e','#e17055','#74b9ff','#dfe6e9','#b2bec3','#636e72','#d63031','#e84393','#0984e3','#6c5ce7','#00b894'];
  for (let i = 0; i < 24; i++) {
    const angle = (i / 24) * 360;
    const rad = angle * Math.PI / 180;
    const r = 556 / 2;
    const x = r + r * Math.cos(rad) - 5;
    const y = r + r * Math.sin(rad) - 5;
    const bulb = document.createElement('div');
    bulb.className = 'bulb';
    bulb.style.left = x + 'px';
    bulb.style.top = y + 'px';
    bulb.style.background = colors[i % colors.length];
    bulb.style.color = colors[i % colors.length];
    container.appendChild(bulb);
  }
}
createBulbs();

// ========== 旋转逻辑 ==========
function spin() {
  if (isSpinning) return;
  if (activeIndices.length === 0) {
    alert('所有分类都排除了！点击"重置转盘"重新开始吧 🔄');
    return;
  }
  if (activeIndices.length === 1) {
    // 只剩一个，直接选中
    showResult(activeIndices[0]);
    return;
  }

  isSpinning = true;
  spinCount++;
  document.getElementById('spinCount').textContent = spinCount;
  document.getElementById('spinBtn').classList.add('disabled');

  const segAngle = (2 * Math.PI) / activeIndices.length;
  // 随机选一个扇区
  const targetIndex = Math.floor(Math.random() * activeIndices.length);
  // 目标扇区的中心角度（在转盘本地坐标中）
  const targetCenter = targetIndex * segAngle + segAngle / 2;
  // 指针在顶部 = -90° = 3π/2 方向
  // 需要让目标扇区转到顶部
  const desiredAngle = (3 * Math.PI / 2) - targetCenter;
  // 归一化
  let normDesired = desiredAngle % (2 * Math.PI);
  if (normDesired < 0) normDesired += 2 * Math.PI;

  // 总旋转 = 当前角度到目标角度 + 多转几圈
  const extraSpins = 5 + Math.random() * 4; // 5~9 圈
  const totalRotation = extraSpins * 2 * Math.PI + (normDesired - currentAngle % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI);

  const duration = 5000 + Math.random() * 2000; // 5~7秒
  const startTime = performance.now();
  const startAngle = currentAngle;

  function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

  function animate(now) {
    const elapsed = now - startTime;
    const progress = Math.min(elapsed / duration, 1);
    const eased = easeOutCubic(progress);
    currentAngle = startAngle + totalRotation * eased;
    drawWheel();

    if (progress < 1) {
      requestAnimationFrame(animate);
    } else {
      currentAngle = currentAngle % (2 * Math.PI);
      isSpinning = false;
      document.getElementById('spinBtn').classList.remove('disabled');
      // 确定最终落在哪个扇区
      const seg = (2 * Math.PI) / activeIndices.length;
      // 指针在顶部 = 角度 3π/2 方向
      let pointerAngle = (3 * Math.PI / 2 - currentAngle) % (2 * Math.PI);
      if (pointerAngle < 0) pointerAngle += 2 * Math.PI;
      const landedIndex = Math.floor(pointerAngle / seg);
      const catIdx = activeIndices[landedIndex];
      setTimeout(() => showResult(catIdx), 300);
    }
  }
  requestAnimationFrame(animate);
}

// ========== 弹窗 ==========
function showResult(catIdx) {
  const cat = CATEGORIES[catIdx];
  document.getElementById('modalEmoji').textContent = cat.emoji;
  document.getElementById('modalCategory').textContent = cat.name;
  document.getElementById('modalDesc').textContent = cat.desc;

  // 填充食物表格
  const tbody = document.getElementById('foodTableBody');
  tbody.innerHTML = '';
  cat.foods.forEach((food, i) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td class="num">${i+1}</td><td>🍽️ ${food[0]}</td><td><span style="color:rgba(255,255,255,0.5);font-size:12px">${food[1]}</span></td>`;
    tbody.appendChild(tr);
  });

  document.getElementById('modal').classList.add('show');
  // 撒花
  launchConfetti();
}

function closeModal() {
  document.getElementById('modal').classList.remove('show');
}

function closeModalAndSpin() {
  document.getElementById('modal').classList.remove('show');
  setTimeout(() => spin(), 300);
}

// 「不想吃」→ 排除当前分类，再转
function skipAndRespin() {
  // 获取当前弹窗显示的分类
  const catName = document.getElementById('modalCategory').textContent;
  const catIdx = CATEGORIES.findIndex(c => c.name === catName);
  if (catIdx >= 0) {
    excludeCategory(catIdx);
  }
  document.getElementById('modal').classList.remove('show');
  setTimeout(() => spin(), 400);
}

function excludeCategory(catIdx) {
  const cat = CATEGORIES[catIdx];
  // 从 active 中移除
  activeIndices = activeIndices.filter(i => i !== catIdx);
  if (!excludedCategories.includes(cat.name)) {
    excludedCategories.push(cat.name);
  }
  updateStats();
  drawWheel();
}

function updateStats() {
  document.getElementById('remainCount').textContent = activeIndices.length;
  document.getElementById('excludedCount').textContent = excludedCategories.length;
  // 更新排除标签
  const bar = document.getElementById('excludedBar');
  bar.innerHTML = excludedCategories.map(name => {
    const cat = CATEGORIES.find(c => c.name === name);
    return `<span class="excluded-tag">${cat ? cat.emoji : ''} ${name} ✕</span>`;
  }).join('');
}

function resetWheel() {
  activeIndices = [...Array(N).keys()];
  excludedCategories = [];
  currentAngle = 0;
  spinCount = 0;
  updateStats();
  document.getElementById('spinCount').textContent = '0';
  drawWheel();
  document.getElementById('modal').classList.remove('show');
}

// ========== 撒花效果 ==========
function launchConfetti() {
  const canvas = document.getElementById('confetti');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const ctx = canvas.getContext('2d');
  const colors = ['#ff6b6b','#ffd93d','#6bcb77','#4d96ff','#e17055','#a29bfe','#fd79a8','#00cec9','#fdcb6e','#e84393'];
  const pieces = [];
  for (let i = 0; i < 120; i++) {
    pieces.push({
      x: Math.random() * canvas.width,
      y: -20 - Math.random() * 100,
      vx: (Math.random() - 0.5) * 4,
      vy: 2 + Math.random() * 4,
      size: 5 + Math.random() * 8,
      color: colors[Math.floor(Math.random() * colors.length)],
      rot: Math.random() * 360,
      rotSpeed: (Math.random() - 0.5) * 10,
      shape: Math.random() > 0.5 ? 'rect' : 'circle'
    });
  }
  let frame = 0;
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    pieces.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.03; // 重力
      p.rot += p.rotSpeed;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot * Math.PI / 180);
      ctx.fillStyle = p.color;
      if (p.shape === 'rect') {
        ctx.fillRect(-p.size/2, -p.size/3, p.size, p.size * 0.66);
      } else {
        ctx.beginPath();
        ctx.arc(0, 0, p.size/2, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    });
    frame++;
    if (frame < 200) requestAnimationFrame(draw);
    else ctx.clearRect(0, 0, canvas.width, canvas.height);
  }
  draw();
}

// ========== 键盘空格 ==========
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space') { e.preventDefault(); spin(); }
  if (e.code === 'Escape') { closeModal(); }
});

// ========== 初始化 ==========
drawWheel();
updateStats();
</script>
